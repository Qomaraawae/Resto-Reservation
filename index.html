<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#3b82f6" />
    <title>Resto Reservation System</title>
    
    <!-- Pembersih Watermark Netlify Tingkat Lanjut -->
    <script>
      (function() {
        // 1. Blokir script Netlify yang memunculkan watermark sebelum dimuat
        const originalCreateElement = document.createElement;
        document.createElement = function(tagName) {
          const element = originalCreateElement.call(this, tagName);
          if (tagName.toLowerCase() === 'script') {
            const originalSetAttribute = element.setAttribute;
            element.setAttribute = function(name, value) {
              if (name === 'src' && value.includes('netlify')) {
                console.log('Memblokir script Netlify:', value);
                return; // Blokir script netlify
              }
              originalSetAttribute.call(this, name, value);
            };
          }
          return element;
        };

        // 2. Hapus paksa elemen watermark jika lolos
        const destroyWatermark = () => {
          document.querySelectorAll('body > div, body > a, body > iframe').forEach(el => {
            // Cek jika elemen mencurigakan berada di pojok kanan bawah
            const style = window.getComputedStyle(el);
            if (
              el.id.includes('netlify') || 
              el.className.includes('netlify') || 
              (style.position === 'fixed' && style.bottom !== 'auto' && style.right !== 'auto' && parseInt(style.zIndex) > 9999) ||
              el.innerHTML.includes('Powered by Netlify')
            ) {
              el.remove();
            }
          });
        };

        // 3. Jalankan terus-menerus setiap 100 milidetik
        setInterval(destroyWatermark, 100);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
